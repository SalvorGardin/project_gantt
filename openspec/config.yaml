schema: spec-driven

context: |
  GanttFlow — однопользовательское статическое веб-приложение для диаграмм Ганта.
  Стек: HTML, CSS, vanilla JavaScript, DHTMLX Gantt из CDN, html-to-image 1.11.11.
  Backend, сборщик, package.json, база данных и автосохранение отсутствуют.
  Рабочие задачи и связи находятся в DHTMLX; state.project хранит исходные данные и метаданные.
  Проверки: node --test tests/project-file.test.cjs; необязательный браузерный сценарий tests/import-browser.cjs.
  Переносимый формат — JSON schema_version: 1. Даты окончания требуют особого внимания:
  форма показывает включительную дату, сериализация сохраняет исключительную дату DHTMLX.
  Документация на русском. Код анализировать и изменять с ponytail в режиме full.
  Текущее поведение — specs/. Предложения — changes/. Исторические требования — reference/.
  Обзор, архитектура, контракт данных и результаты анализа — README.md, architecture.md, audit.md.

rules:
  proposal:
    - Отделять существующее поведение от предлагаемого; указывать проблему и границы изменения.
  specs:
    - Использовать Requirement, SHALL или MUST и сценарии WHEN/THEN; не выдавать дефекты за желаемое поведение.
  design:
    - Выбирать минимальное решение по ponytail; сохранять совместимость файлов проекта.
  tasks:
    - Включать проверки рисков изменения и синхронизацию спецификаций.
